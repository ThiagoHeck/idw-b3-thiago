    <h1 class="text-center">Formulário de inscrição</h1>

    <form>
      <div class="mb-3">
        <label for="inputNome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="inputNome" required />
      </div>
      <div class="mb-3">
        <label for="inputEmail1" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="inputEmail1"
          aria-describedby="emailHelp"
          required
        />
        <div id="emailHelp" class="form-text">
          O email será usado para contato e envio de informações sobre o curso.
          Não compartilharemos seu email com ninguém.
        </div>
      </div>

      <div class="mb-3">
        <label for="inputCurso" class="form-label">Curso</label>
        <select class="form-select" id="inputCurso">
          <option selected>Selecione um curso</option>
          <option value="AutoCAD">AutoCAD</option>
          <option value="Tinkercad">Tinkercad</option>
          <option value="Ambos">Ambos</option>
        </select>
      </div>

      <br />

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
